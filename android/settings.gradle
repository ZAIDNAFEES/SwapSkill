// Auto-detect Android SDK and generate local.properties if missing
File localPropertiesFile = file('local.properties')
if (!localPropertiesFile.exists()) {
    String sdkDir = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
    if (!sdkDir) {
        String userHome = System.getProperty('user.home')
        String localAppData = System.getenv('LOCALAPPDATA')
        List<String> candidatePaths = []
        if (localAppData) {
            candidatePaths.add("${localAppData}\\Android\\Sdk")
            candidatePaths.add("${localAppData}/Android/Sdk")
        }
        if (userHome) {
            candidatePaths.add("${userHome}\\AppData\\Local\\Android\\Sdk")
            candidatePaths.add("${userHome}/Android/Sdk")
            candidatePaths.add("${userHome}/Library/Android/sdk")
        }
        for (String candidate : candidatePaths) {
            File candFile = new File(candidate)
            if (candFile.exists() && candFile.isDirectory()) {
                sdkDir = candFile.absolutePath
                break
            }
        }
    }
    if (sdkDir) {
        File sdkDirFile = new File(sdkDir)
        if (sdkDirFile.exists()) {
            String sanitizedPath = sdkDirFile.absolutePath.replace('\\', '/')
            localPropertiesFile.text = "# Auto-generated by SwapSkill Gradle configuration\nsdk.dir=${sanitizedPath}\n"
        }
    }
}

include ':app'

// Safely include capacitor-cordova-android-plugins if present
def cordovaPluginsDir = file('capacitor-cordova-android-plugins')
if (cordovaPluginsDir.exists()) {
    include ':capacitor-cordova-android-plugins'
    project(':capacitor-cordova-android-plugins').projectDir = cordovaPluginsDir
}

// Safely apply capacitor.settings.gradle if present
def capacitorSettings = file('capacitor.settings.gradle')
if (capacitorSettings.exists()) {
    apply from: 'capacitor.settings.gradle'
}
